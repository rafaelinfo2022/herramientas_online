{% extends "base.html" %}
{% block content %}

<div style="max-width:800px;margin:30px auto;background:#fff;padding:30px;
            border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);">

    <p style="font-size:17px;color:#444;margin-bottom:20px;">
        Si necesitás comunicarte con nosotros, enviar sugerencias o resolver dudas,
        completá este formulario. Respondemos a la brevedad.
    </p>

    <form method="POST" style="display:flex;flex-direction:column;gap:15px;">

        <div>
            <label for="nombre" style="font-weight:600;">Nombre</label>
            <input type="text" id="nombre" name="nombre" required
                   style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;">
        </div>

        <div>
            <label for="email" style="font-weight:600;">Email</label>
            <input type="email" id="email" name="email" required
                   style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;">
        </div>

        <div>
            <label for="mensaje" style="font-weight:600;">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="6" required
                      style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;"></textarea>
        </div>

        <button type="submit"
                style="background:#1a73e8;color:#fff;padding:12px;border:none;border-radius:8px;
                font-size:16px;font-weight:700;cursor:pointer;">
            Enviar mensaje
        </button>

    </form>

</div>

{% endblock %}
