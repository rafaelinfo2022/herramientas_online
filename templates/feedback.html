{% extends "base.html" %}
{% block content %}

<h2 class="text-gradient" style="font-size: 30px; font-weight: 800; text-align:center; margin-bottom: 10px;">
    💬 Ayudanos a Mejorar
</h2>

<p style="text-align:center; margin-bottom: 25px; color:#555;">
    Tu opinión es muy importante. Contanos qué problema encontraste o qué herramienta te gustaría agregar.
</p>

<div style="max-width: 600px; margin: 0 auto;">
    <form method="POST" action="/feedback" style="background:#fff; padding:25px; border-radius:12px; 
    box-shadow:0 6px 18px rgba(0,0,0,0.1);">

        <label for="nombre" style="font-weight:600;">Tu nombre (opcional)</label>
        <input type="text" name="nombre" id="nombre" placeholder="Ejemplo: Omar" 
        style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;">

        <label for="email" style="font-weight:600;">Email (opcional)</label>
        <input type="email" name="email" id="email" placeholder="Si querés que te respondamos"
        style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;">

        <label for="mensaje" style="font-weight:600;">Tu mensaje *</label>
        <textarea name="mensaje" id="mensaje" rows="5" required
        placeholder="¿Qué problema encontraste? ¿Qué podemos mejorar?"
        style="width:100%; padding:12px; margin-bottom:20px; border-radius:8px; border:1px solid #ccc;"></textarea>

        <button type="submit" 
            style="width:100%; padding:12px; background:linear-gradient(135deg,#4e6bff,#6d8dff);
            border:none; color:white; font-size:17px; border-radius:10px; cursor:pointer;">
            Enviar Comentario
        </button>
    </form>
</div>

{% endblock %}
