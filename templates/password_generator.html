{% extends "base.html" %}

{% block content %}
<div class="container mt-5 d-flex justify-content-center">
    <div class="glass-card p-5" style="max-width: 600px; width: 100%;">
        <h1 class="text-center mb-4 text-gradient">Generador de Contraseñas Seguras Online</h1>

        <p class="text-center text-muted mb-4">
            Creá contraseñas fuertes, aleatorias y protegidas con un solo clic. Generá claves con mayúsculas, números y símbolos para máxima seguridad.
        </p>


        <form method="post">

            <!-- Length Input -->
            <div class="mb-4">
                <label class="form-label fw-bold">Longitud: <span id="lenVal">12</span></label>
                <input type="range" class="form-range" name="length" min="4" max="50" value="12"
                    oninput="document.getElementById('lenVal').innerText = this.value">
            </div>

            <!-- Options -->
            <div class="mb-4">
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" name="upper" checked id="upperCheck">
                    <label class="form-check-label" for="upperCheck">Incluir Mayúsculas (A-Z)</label>
                </div>
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" name="numbers" checked id="numCheck">
                    <label class="form-check-label" for="numCheck">Incluir Números (0-9)</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="symbols" id="symCheck">
                    <label class="form-check-label" for="symCheck">Incluir Símbolos (!@#$)</label>
                </div>
            </div>

            <!-- Botón de Acción -->
            <button class="btn btn-gradient w-100 py-3 fw-bold shadow-sm" type="submit">
                ⚡ Generar Contraseña
            </button>

        </form>

        {% if password %}
        <div class="mt-4 animate-fade-in">
            <label class="form-label fw-bold text-success">Tu nueva contraseña:</label>
            <div class="input-group">
                <input type="text" class="form-control text-center fw-bold fs-5" value="{{ password }}" id="passBox"
                    readonly>
                <button class="btn btn-outline-success" onclick="copyPassword()">
                    📋 Copiar
                </button>
            </div>
        </div>
        {% endif %}
    </div>
</div>

<script>
    function copyPassword() {
        const copyText = document.getElementById("passBox");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
        alert("¡Contraseña copiada!");
    }
</script>
{% endblock %}
